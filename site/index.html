// Human-readable note for a duplicate config
function dupNote(cfg) {
  const n = (cfg.selected || []).length;
  if (!n) return 'no rows selected — defaults to first-row-only';
  if (cfg.mode === 'any')  return `merged as one event; complete if any of ${n} selected row${n>1?'s':''} is complete`;
  if (cfg.mode === 'all')  return `(v0.5.3 will split into ${n} sub-events; merging like "Any" for now)`;
  return `tracks row ${cfg.selected[0]} only`;
}
function refreshDupNote(code) {
  const cfg = getAppSettings().duplicates[code];
  const el = document.querySelector('[data-dup-note="' + cssEscAttr(code) + '"]');
  if (el) el.textContent = dupNote(cfg);
}
function updateDupConfig(code, patch) {
  const s = getAppSettings();
  s.duplicates[code] = Object.assign({ mode: 'one', selected: [] }, s.duplicates[code] || {}, patch);
  saveAppSettings();
}

// v0.5.2f: apply-duplicate-resolution.
// 'one' mode → use the single selected row (radio behavior).
// 'any' mode → synthesize a merged event whose per-student cell is the
//   "best status" across selected rows. User's case: F-16 TP and T-38 TP
//   share an event code; one student completed F-16 TP (lightGrey) while
//   T-38 TP cell is dark-grey (not required); other students reverse.
//   Merging picks the best status per col → student is "complete" on the
//   merged event regardless of which row recorded it.
// 'all' mode → not yet implemented as separate sub-events. Falls back to
//   'any' with a console warning. Wiring sub-event nodes through the DAG
//   builder is a v0.5.3 feature (would need synthetic codes + edge
//   rewriting elsewhere in the MCG graph).
function applyDupResolution() {
  const payload = state && state.payload;
  if (!payload || !payload.duplicates || !payload.duplicates.length) return;
  const settings = getAppSettings();
  for (const d of payload.duplicates) {
    const cfg = settings.duplicates[d.code] || { mode: 'one', selected: [] };
    const allRows = (payload.rowsByCode && payload.rowsByCode[d.code]) || [];
    if (!allRows.length) continue;
    const selRows = (cfg.selected && cfg.selected.length)
      ? allRows.filter(r => cfg.selected.indexOf(r.row) !== -1)
      : [];
    if (cfg.mode === 'one') {
      // Single row selected → use it. None selected → first row default.
      payload.byCode[d.code] = selRows[0] || allRows[0];
    } else if (cfg.mode === 'any' || cfg.mode === 'all') {
      const rowsToMerge = selRows.length ? selRows : allRows;
      payload.byCode[d.code] = mergeDupRowsBestStatus(d.code, rowsToMerge, cfg.mode);
      if (cfg.mode === 'all') {
        console.warn('[bbcs] dup mode "all" not yet split into sub-events; merged like "any" for', d.code);
      }
    } else {
      payload.byCode[d.code] = allRows[0];
    }
    payload.byCode[d.code].duplicated = true;
  }
}

// Pick "best" cell across rows for each student col. Priority:
//   complete (lightGrey OR paired+strike) > scheduled (white + future date)
//     > paired-opted (paired no strike) > pending past-dated (white + past)
//     > pending blank (white empty) > excused (darkGrey)
// Returns a synthesized event object that mirrors a normal Big Board row
// so downstream consumers (classifyCell, renderRoleCol) work unchanged.
function mergeDupRowsBestStatus(code, rows, mode) {
  function score(c) {
    if (!c) return -1;
    if (c.rgbFamily === 'lightGrey') return 100;
    if (c.rgbFamily === 'paired' && c.strikethrough) return 100;
    if (c.rgbFamily === 'paired') return 60;
    if (c.rgbFamily === 'white' && c.value && c.strikethrough) return 100;  // v0.6.0: struck date = complete
    if (c.rgbFamily === 'white' && c.value) return 70;  // dated (sched or past-sched)
    if (c.rgbFamily === 'darkGrey') return 10;
    return 0;  // blank pending
  }
  // Group cells by col across all rows
  const byCol = {};
  for (const r of rows) {
    for (const c of (r.cells || [])) {
      (byCol[c.col] = byCol[c.col] || []).push(c);
    }
  }
  const mergedCells = [];
  for (const col of Object.keys(byCol).map(Number).sort((a,b)=>a-b)) {
    const cells = byCol[col];
    let best = cells[0], bestScore = score(best);
    for (let i = 1; i < cells.length; i++) {
      const s = score(cells[i]);
      if (s > bestScore) { best = cells[i]; bestScore = s; }
    }
    mergedCells.push(Object.assign({}, best, { col }));
  }
  // Use first row as template for non-cell metadata; replace cells.
  const template = rows[0];
  return Object.assign({}, template, {
    cells: mergedCells,
    title: rows.map(r => r.title).filter(Boolean).join(' / '),
    duplicateMerge: { mode, sourceRows: rows.map(r => r.row) },
  });
}

function renderValidationSummary(payload, goalCode) {
  if (!payload) return '<p class="muted small">No board loaded yet.</p>';
  const out = [];
  const dupes = payload.duplicates || [];
  out.push(`<div><strong>Duplicate BB codes:</strong> ${dupes.length}${dupes.length ? ' — ' + dupes.map(d => '<span class="mono">' + escHtml(d.code) + '</span>').join(', ') : ''}</div>`);

  // BB codes not in MCG (informational — the app won't render them anyway)
  const mcgCodes = (MCG_GRAPH && MCG_GRAPH.events) ? new Set(Object.keys(MCG_GRAPH.events)) : new Set();
  // v0.6.0: uncoded rows are indexed too (keyed by title) — count them apart
  // from rows that carry a code the MCG doesn't know.
  const notInMcg = Object.keys(payload.byCode || {}).filter(c => !mcgCodes.has(c));
  const bbOnly = notInMcg.filter(c => !payload.byCode[c].uncoded);
  const uncoded = notInMcg.filter(c => payload.byCode[c].uncoded);
  if (payload.layoutNote) {
    out.push(`<div style="color:#7a4500"><strong>Layout:</strong> ${escHtml(payload.layoutNote)}</div>`);
  }
  out.push(`<div><strong>BB codes not in MCG:</strong> ${bbOnly.length}${bbOnly.length ? ' <span class="muted small">(no prereq chain — can still be picked as a target)</span>' : ''}</div>`);
  if (bbOnly.length) {
    out.push('<ul class="small mono">' + bbOnly.map(c => '<li>' + escHtml(c) + ' — ' + escHtml(payload.byCode[c].title || '') + '</li>').join('') + '</ul>');
  }
  out.push(`<div><strong>BB rows with no event code:</strong> ${uncoded.length}${uncoded.length ? ' <span class="muted small">(board-only; find them by name in the Target Event search)</span>' : ''}</div>`);

  // MCG-required for current goal but missing from BB
  if (goalCode && render && render.buildDag) {
    try {
      const dag = render.buildDag(goalCode, payload, { mode: 'class' });
      const missing = Object.values(dag.nodesByCode).filter(n => n.isMissing);
      out.push(`<div><strong>Missing from BB for ${escHtml(goalCode)} chain:</strong> ${missing.length}${missing.length ? ' — ' + missing.map(n => '<span class="mono">' + escHtml(n.code) + '</span>').join(', ') : ''}</div>`);
    } catch (e) {
      out.push('<div class="small muted">(could not compute — ' + escHtml(e.message) + ')</div>');
    }
  }
  return out.join('\n');
}

function escAttr(s)     { return String(s || '').replace(/["&<>]/g, c => ({'"':'&quot;','&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function cssEscAttr(s)  { return escAttr(s); }

// Generic debounce
function debounce(fn, ms) {
  let t = null;
  return function () {
    const args = arguments;
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

      <div style="display:flex;justify-content:center"><span style="width:14px;height:14px;border-radius:50%;background:repeating-linear-gradient(45deg,#bbb 0,#bbb 2px,#fff 2px,#fff 4px);border:1px solid #888"></span></div><div>Excused on the board (dark-grey) although the MCG says required — check the board.</div>
    </div>

    <h4>Node header (Student view)</h4>
    <div class="legend-grid">
      <div class="legend-swatch" style="background:#2e7d32;border-color:#1f5313"></div><div><strong>DONE</strong> — student has completed this event</div>
      <div class="legend-swatch" style="background:#d7e8f5;border-color:#5c8dba"></div><div><strong>OPTED</strong> — prereqs met, student can do this event</div>
      <div class="legend-swatch" style="background:#fff4cc;border-color:#b58700"></div><div><strong>SCHEDULED</strong> — date on the board ("· VERIFY" once it has passed). <strong>PAIRED ·</strong> prefix when the cell is colored.</div>
      <div class="legend-swatch" style="background:#fff8d6;border-color:#d4a017"></div><div><strong>… · VERIFY EARLIER / PREREQS PLANNED</strong> — prereqs not marked complete, but all of them are scheduled</div>
      <div class="legend-swatch" style="background:#fdecea;border-color:#c62828"></div><div><strong>NOT OPTED</strong> — at least one on-board prereq has no plan</div>
      <div class="legend-swatch" style="background:#ff8c00;border-color:#c62828"></div><div><strong>⚠ SCHEDULED · NOT OPTED</strong> — planning error: student is on the schedule but a prereq has no plan</div>
    </div>

    <h4>Arrows</h4>
    <p style="font-size:12px; color:var(--ink-soft)">
      Arrow color matches the <em>source</em> node's status.
      Green flows from complete/advanced nodes; red flows from blocking ones.
      Hover a line to see off-board events it passes through.
    </p>

    <h4>Target event</h4>
    <p style="font-size:12px; color:var(--ink-soft)">
      Any event can be the target: open <strong>Target Event</strong> (or press <strong>/</strong>) and type part of a code or name.
      Events that are on the board but not in the MCG have no prerequisite chain — the view is that event's own roster.
      Pin (★) the ones you come back to. The address bar tracks the target, so a view can be bookmarked.
    </p>

    <h4>What's hidden / dimmed</h4>
    <ul>
      <li><strong>Off-board prereqs</strong> (lectures, reports, debriefs) are bridged through, not drawn. Settings can also hide MIBs, exams, ground school.</li>
      <li><strong>Students outside the target's scope:</strong> a PF 8332F (ABM/FTE/P) view never shows CSO/RPA, even on prereq nodes.</li>
      <li><strong>Student view:</strong> only that student's chain is drawn; if the target doesn't apply to them, a Not Applicable screen is shown.</li>
      <li><strong>Dimmed names:</strong> on-board prereqs for that node aren't met yet.</li>
      <li><strong>Click a node</strong> to spotlight it and its direct prerequisites; click again or click empty space to clear.</li>
    </ul>

    <h4>Collapsed nodes</h4>
    <p style="font-size:12px; color:var(--ink-soft)">
      Nodes default to collapsed (just code + status color) to reduce clutter; the target starts expanded. Click (+) on any node to expand, or use the
      <strong>Expand all</strong> / <strong>Collapse all</strong> buttons in the sub-bar.
    </p>
  `;
  openPanel('Legend', html);
}

/* --------------------------------------------------------
 * Debug tables — Students & Events property inspection
 * Shows exactly the properties the code uses for filtering.
 * -------------------------------------------------------- */
let _debugPreviousView = null;  // stash so "Back" returns to the DAG

function cellClass(rgbFamily) {
  if (rgbFamily === 'darkGrey') return 'cell-dg';
  if (rgbFamily === 'lightGrey') return 'cell-lg';
  if (rgbFamily === 'paired') return 'cell-pa';
  if (rgbFamily === 'white') return 'cell-wh';
  return 'cell-na';
}
function cellLabel(cell) {
  if (!cell) return '—';
  if (cell.rgbFamily === 'darkGrey') return 'DG';
  if (cell.rgbFamily === 'lightGrey') return cell.value ? 'LG ' + cell.value : 'LG';
  if (cell.rgbFamily === 'paired') return cell.value ? 'PA ' + cell.value : 'PA';
  if (cell.rgbFamily === 'white' && cell.value) return cell.value;
  if (cell.rgbFamily === 'white') return '·';
  return '?';
}

function renderDebugStudents() {
  if (!state || !state.payload) return;
  const main = $('#main');
  _debugPreviousView = state.goalCode;
  main.innerHTML = '';

  const payload = state.payload;
  const wrap = el('div', { class: 'debug-table-wrap' });

  // Back button
  const backBtn = el('button', { class: 'btn debug-back-btn' }, '← Back to DAG');
  backBtn.addEventListener('click', () => { if (state.payload) renderCurrent(); });
  wrap.appendChild(backBtn);

  wrap.appendChild(el('h2', null, 'Student Properties'));
  wrap.appendChild(el('p', { class: 'subtitle' }, 'Properties used by the code for filtering. Cell colors are from the board (ground truth). DG=dark-grey (not required), LG=light-grey (complete), PA=paired, ·=white empty, date=white w/ date.'));

  // Collect on-board events for column headers — show goal events + let user filter
  const goalEvents = MCG_GRAPH.goalEvents.filter(g => payload.byCode[g]);
  // v0.6.0: a custom target gets a column too
  if (state.goalCode && payload.byCode[state.goalCode] && goalEvents.indexOf(state.goalCode) === -1) {
    goalEvents.push(state.goalCode);
  }

  // Filter
  const filterDiv = el('div', { class: 'debug-filter' });
  filterDiv.appendChild(el('label', null, 'Filter events: '));
  const filterInput = el('input', { type: 'text', placeholder: 'Type event code to add columns…', id: 'debug-evt-filter' });
  filterDiv.appendChild(filterInput);
  const filterInfo = el('span', { style: 'font-size:11px;color:var(--ink-faint)' }, `Showing ${goalEvents.length} goal events. Type a code (e.g. "CF 6370") to add columns.`);
  filterDiv.appendChild(filterInfo);
  wrap.appendChild(filterDiv);

  // Build table
  let extraCodes = [];
  function buildTable() {
    const existingTable = wrap.querySelector('table');
    if (existingTable) existingTable.remove();

    const allCodes = [...goalEvents, ...extraCodes];
    const table = el('table', { class: 'debug-table' });

    // Header
    const thead = el('thead');
    const hRow = el('tr');
    for (const h of ['#', 'Name', 'Type', 'Col']) hRow.appendChild(el('th', null, h));
    for (const code of allCodes) {
      const mcg = MCG_GRAPH.events[code];
      const th = el('th', { title: mcg ? mcg.eventName : code }, code);
      hRow.appendChild(th);
    }
    thead.appendChild(hRow);
    table.appendChild(thead);

    // Body
    const tbody = el('tbody');
    payload.students.forEach((s, idx) => {
      const row = el('tr');
      row.appendChild(el('td', null, String(idx + 1)));
      row.appendChild(el('td', null, s.name));
      row.appendChild(el('td', null, s.type));
      row.appendChild(el('td', null, String(s.col)));

      for (const code of allCodes) {
        const evt = payload.byCode[code];
        const cell = evt ? evt.cells.find(c => c.col === s.col) : null;
        const td = el('td', { class: cellClass(cell ? cell.rgbFamily : null), title: code + ': ' + (cell ? cell.rgbFamily + (cell.value ? ' = ' + cell.value : '') : 'no cell') }, cellLabel(cell));
        row.appendChild(td);
      }
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
  }

  buildTable();

  // Live filter: type event code to add columns
  filterInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const val = filterInput.value.trim().toUpperCase().replace(/\s+/g, ' ');
    if (!val) return;
    // Find matching on-board events
    const matches = Object.keys(payload.byCode).filter(c => c.includes(val) && !goalEvents.includes(c) && !extraCodes.includes(c));
    if (matches.length === 0) {
      filterInfo.textContent = `No on-board event matching "${val}"`;
      return;
    }
    extraCodes.push(...matches.slice(0, 10));
    filterInfo.textContent = `Added: ${matches.slice(0, 10).join(', ')}. ${goalEvents.length + extraCodes.length} total columns.`;
    filterInput.value = '';
    buildTable();
  });

  main.appendChild(wrap);
}

function renderDebugEvents() {
  if (!state || !state.payload) return;
  const main = $('#main');
  _debugPreviousView = state.goalCode;
  main.innerHTML = '';

  const payload = state.payload;
  const wrap = el('div', { class: 'debug-table-wrap' });

  // Back button
  const backBtn = el('button', { class: 'btn debug-back-btn' }, '← Back to DAG');
  backBtn.addEventListener('click', () => { if (state.payload) renderCurrent(); });
  wrap.appendChild(backBtn);

  wrap.appendChild(el('h2', null, 'Event Properties'));
  wrap.appendChild(el('p', { class: 'subtitle' }, 'Properties used by the code for filtering & connecting. MCG Applicability = metadata from MCG (informational). Board Cells = ground truth from the big board. Click a row to expand per-student cells.'));

  // Filter
  const filterDiv = el('div', { class: 'debug-filter' });
  filterDiv.appendChild(el('label', null, 'Filter: '));
  const filterInput = el('input', { type: 'text', placeholder: 'Filter by code or title…', id: 'debug-evt-search' });
  filterDiv.appendChild(filterInput);
  const scopeSelect = el('select', { id: 'debug-evt-scope' });
  scopeSelect.appendChild(el('option', { value: 'all' }, 'All on-board events'));
  scopeSelect.appendChild(el('option', { value: 'dag' }, 'Current DAG only'));
  filterDiv.appendChild(scopeSelect);
  wrap.appendChild(filterDiv);

  // Student type summary columns
  const studentTypes = [...new Set(payload.students.map(s => s.type))].sort();

  // Current DAG codes
  let dagCodes = null;
  if (state.goalCode && payload.byCode[state.goalCode]) {
    const dag = render.buildDag(state.goalCode, payload);
    dagCodes = new Set(Object.keys(dag.nodesByCode));
  }

  function buildTable() {
    const existing = wrap.querySelector('table');
    if (existing) existing.remove();

    const searchVal = (filterInput.value || '').trim().toUpperCase();
    const scopeVal = scopeSelect.value;

    const table = el('table', { class: 'debug-table' });
    const thead = el('thead');
    const hRow = el('tr');
    for (const h of ['Code', 'Title', 'Phase', 'MCG Applicability', 'Prerequisites']) {
      hRow.appendChild(el('th', null, h));
    }
    // Per-type cell summary columns
    for (const t of studentTypes) {
      hRow.appendChild(el('th', { title: `Cell colors for ${t} students` }, t));
    }
    hRow.appendChild(el('th', null, 'Flags'));
    thead.appendChild(hRow);
    table.appendChild(thead);

    const tbody = el('tbody');
    const codes = Object.keys(payload.byCode).sort();

    for (const code of codes) {
      // Filter by scope
      if (scopeVal === 'dag' && dagCodes && !dagCodes.has(code)) continue;
      // Filter by search
      const evt = payload.byCode[code];
      const mcg = MCG_GRAPH.events[code];
      const title = (mcg && mcg.eventName) || evt.title || '';
      if (searchVal && !code.includes(searchVal) && !title.toUpperCase().includes(searchVal)) continue;

      const row = el('tr', { style: 'cursor:pointer' });

      // Code
      row.appendChild(el('td', { style: 'font-weight:700' }, evt.uncoded ? '(row ' + evt.row + ')' : code));

      // Title
      row.appendChild(el('td', null, title));

      // Phase
      row.appendChild(el('td', null, mcg ? mcg.phase : (evt.uncoded ? '—' : code.substring(0, 2))));

      // MCG Applicability
      const apps = mcg ? (mcg.applicability || []) : [];
      const appTd = el('td', { class: 'app-list' }, apps.join(', ') || '(unrestricted)');
      row.appendChild(appTd);

      // Prerequisites
      const prereqs = mcg ? (mcg.prerequisites || []) : [];
      const prereqCodes = prereqs.map(p => {
        const onBoard = !!payload.byCode[p.code];
        return onBoard ? p.code : p.code + '*';
      });
      const prereqTd = el('td', { class: 'prereq-list' }, prereqCodes.join(', ') || '(none)');
      row.appendChild(prereqTd);

      // Per-type cell summary
      const flags = [];
      for (const t of studentTypes) {
        const studs = payload.students.filter(s => s.type === t);
        let dg = 0, wh = 0, whDate = 0, lg = 0, pa = 0;
        for (const s of studs) {
          const cell = evt.cells.find(c => c.col === s.col);
          if (!cell || cell.rgbFamily === 'white') {
            if (cell && cell.value) whDate++;
            else wh++;
          } else if (cell.rgbFamily === 'darkGrey') dg++;
          else if (cell.rgbFamily === 'lightGrey') lg++;
          else if (cell.rgbFamily === 'paired') pa++;
        }
        const parts = [];
        if (dg) parts.push(dg + 'dg');
        if (wh) parts.push(wh + 'wh');
        if (whDate) parts.push(whDate + 'dt');
        if (lg) parts.push(lg + 'lg');
        if (pa) parts.push(pa + 'pa');
        const td = el('td', { style: 'font-size:10px' }, parts.join(' ') || '—');

        // Flag: MCG says not applicable but board has non-dark-grey cells
        const mcgApplicable = apps.length === 0 || apps.some(a => {
          if (a === 'P') return /^Pilot/i.test(t);
          return a === t;
        });
        if (!mcgApplicable && (wh + whDate + lg + pa) > 0) {
          td.classList.add('flag');
          td.title = `MCG says ${t} not applicable, but board has ${wh + whDate + lg + pa} non-dark-grey cells`;
          flags.push(t);
        }
        row.appendChild(td);
      }

      // Flags column
      const flagTd = el('td', null);
      if (flags.length) {
        flagTd.innerHTML = '<span class="flag" title="MCG/board mismatch">⚠ ' + flags.join(', ') + '</span>';
      }
      row.appendChild(flagTd);

      // Click to expand: show per-student cells
      row.addEventListener('click', () => {
        const nextRow = row.nextElementSibling;
        if (nextRow && nextRow.classList.contains('debug-expand')) {
          nextRow.remove();
          return;
        }
        const expandRow = el('tr', { class: 'debug-expand' });
        const expandTd = el('td', { colspan: String(6 + studentTypes.length + 1), style: 'padding:8px;background:#f9f9f9' });

        // Mini table of per-student cells
        const mini = el('table', { class: 'debug-table', style: 'width:auto;margin:0' });
        const mHead = el('tr');
        for (const h of ['Student', 'Type', 'Cell Color', 'Value', 'Strikethrough']) mHead.appendChild(el('th', null, h));
        mini.appendChild(mHead);

        for (const s of payload.students) {
          const cell = evt.cells.find(c => c.col === s.col);
          const mRow = el('tr');
          mRow.appendChild(el('td', null, s.name));
          mRow.appendChild(el('td', null, s.type));
          const colorTd = el('td', { class: cellClass(cell ? cell.rgbFamily : null) }, cell ? cell.rgbFamily : 'no cell');
          mRow.appendChild(colorTd);
          mRow.appendChild(el('td', null, cell && cell.value ? String(cell.value) : ''));
          mRow.appendChild(el('td', null, cell && cell.strikethrough ? 'yes' : ''));
          mini.appendChild(mRow);
        }
        expandTd.appendChild(mini);
        expandRow.appendChild(expandTd);
        row.after(expandRow);
      });

      tbody.appendChild(row);
    }
    table.appendChild(tbody);
    wrap.appendChild(table);
  }

  buildTable();

  // Live filter
  filterInput.addEventListener('input', debounce(buildTable, 200));
  scopeSelect.addEventListener('change', buildTable);

  main.appendChild(wrap);
}

/* --------------------------------------------------------
 * cache status helpers (footer)
 * -------------------------------------------------------- */
function updateCacheFooter() {
  const info = api.cacheInfo();
  const el = $('#foot-cache');
  if (!info.length) {
    el.textContent = 'cache: empty';
    el.style.color = 'var(--ink-faint)';
    return;
  }
  const totalKB = info.reduce((s, i) => s + i.sizeKB, 0);
  const mostRecent = info
    .filter(i => i.cachedAt)
    .sort((a, b) => b.cachedAt.localeCompare(a.cachedAt))[0];
  const when = mostRecent ? new Date(mostRecent.cachedAt).toLocaleString() : '?';
  const tip = info.map(i => `${i.name} · ${i.sizeKB} KB · ${i.cachedAt ? new Date(i.cachedAt).toLocaleString() : '?'}`).join('\n');
  el.textContent = `cache: ${info.length} sheet${info.length > 1 ? 's' : ''} · ${totalKB} KB · newest ${when}`;
  el.title = tip;
  el.style.color = 'var(--ink-soft)';
}

/* --------------------------------------------------------
 * v0.6.0 — Target Event picker (DOM side of `targets`).
 *
 * A button showing the current target; clicking it (or pressing
 * "/") opens a search box over a list. With an empty query the
 * list is the preset goal events, then pinned, then recent custom
 * targets. Typing searches every MCG event and every board row
 * by code fragment or by words in the name.
 *
 * The chosen target is kept in state.goalCode, remembered in
 * localStorage, and mirrored to the URL as #target=<code> so a
 * view can be bookmarked or sent to someone.
 * -------------------------------------------------------- */
const targetPicker = (() => {
  const MAX_SHOWN = 60;
  let catalog = [];
  let byCode = {};
  let rows = [];     // entries currently listed, in display order
  let active = -1;   // index into rows of the keyboard-highlighted one

  // Uncoded board rows are keyed by title; show "row N" in the code slot.
  function codeLabel(t) { return t.uncoded ? 'row ' + t.row : t.code; }

  function hashTarget() {
    let raw = null;
    try { raw = new URLSearchParams(String(location.hash || '').replace(/^#/, '')).get('target'); } catch (_) {}
    if (!raw) return null;
    const norm = parse.normalizeCode(raw.toUpperCase());   // accepts "tf7503f" too
    return byCode[norm] ? norm : raw;
  }
  function writeHash(code) {
    try { history.replaceState(null, '', '#target=' + encodeURIComponent(code)); } catch (_) {}
  }

  function setButton(t) {
    $('#target-btn-code').textContent = t ? codeLabel(t) : '—';
    $('#target-btn-name').textContent = t ? t.name
      : (state.payload ? 'pick a target event' : 'load a board first');
  }

  // Rebuild the catalog for the loaded board and settle on a target:
  // the current one if it still exists here, else the URL's, else the
  // last one used, else the first preset that's on this board.
  function refresh() {
    const btn = $('#target-btn');
    if (!state.payload) { btn.disabled = true; setButton(null); return; }
    catalog = targets.buildCatalog(state.payload);
    byCode = {};
    for (const t of catalog) byCode[t.code] = t;
    btn.disabled = false;
    let pick = [state.goalCode, hashTarget(), targets.lastTarget()].find(c => c && byCode[c]);
    if (!pick) pick = (MCG_GRAPH.goalEvents || []).find(c => state.payload.byCode[c]) || null;
    state.goalCode = pick;
    setButton(pick ? byCode[pick] : null);
  }

  function select(code) {
    const t = byCode[code];
    if (!t) return;
    state.goalCode = code;
    targets.saveLast(code);
    if (!t.preset) targets.noteUsed(code);
    setButton(t);
    writeHash(code);
    close();
    renderCurrent();
  }

  function isOpen() { return !$('#target-pop').hidden; }
  function open() {
    if ($('#target-btn').disabled) return;
    $('#target-pop').hidden = false;
    $('#target-btn').setAttribute('aria-expanded', 'true');
    const input = $('#target-search');
    input.value = '';
    renderList('');
    input.focus();
  }
  function close() {
    $('#target-pop').hidden = true;
    $('#target-btn').setAttribute('aria-expanded', 'false');
  }

  function rowEl(t, idx) {
    const row = el('div', {
      class: 'target-row' + (t.onBoard ? '' : ' off-board') + (t.code === state.goalCode ? ' current' : ''),
      role: 'option',
    });
    row.appendChild(el('span', { class: 'target-row-code' }, codeLabel(t)));
    row.appendChild(el('span', { class: 'target-row-name', title: t.name }, t.name));
    if (t.typeName) row.appendChild(el('span', { class: 'target-tag' }, t.typeName));
    if (!t.inMcg) {
      row.appendChild(el('span', {
        class: 'target-tag t-board',
        title: 'On the Big Board but not in the MCG — no prerequisite chain is known. The view shows who has done it.',
      }, 'board only'));
    } else if (!t.onBoard) {
      row.appendChild(el('span', {
        class: 'target-tag t-off',
        title: 'In the MCG but not tracked on this board. The view shows the board events that lead to it.',
      }, 'not on board'));
    }
    if (!t.preset) {
      const on = targets.isPinned(t.code);
      const pin = el('button', {
        type: 'button', class: 'target-pin' + (on ? ' on' : ''),
        title: on ? 'Unpin' : 'Pin — keep this target in the short list',
      }, on ? '★' : '☆');
      pin.addEventListener('click', (e) => {
        e.stopPropagation();
        targets.togglePin(t.code);
        renderList($('#target-search').value);
        $('#target-search').focus();
      });
      row.appendChild(pin);
    }
    row.addEventListener('click', () => select(t.code));
    row.addEventListener('mousemove', () => { if (active !== idx) { active = idx; paintActive(false); } });
    return row;
  }

  function renderList(q) {
    const list = $('#target-list');
    list.innerHTML = '';
    rows = [];
    const section = (title, entries) => {
      if (!entries.length) return;
      list.appendChild(el('div', { class: 'target-sec' }, title));
      for (const t of entries) { rows.push(t); list.appendChild(rowEl(t, rows.length - 1)); }
    };
    const query = String(q || '').trim();
    if (!query) {
      const pins = targets.pinned().map(c => byCode[c]).filter(Boolean);
      section('Practical & comprehensive exams', (MCG_GRAPH.goalEvents || []).map(c => byCode[c]).filter(Boolean));
      section('Pinned', pins);
      section('Recent custom targets', targets.recents().map(c => byCode[c]).filter(t => t && pins.indexOf(t) === -1));
      list.appendChild(el('div', { class: 'target-empty' },
        `Type to search all ${catalog.length} events — part of a code ("7503", "sy 75") or of a name ("capstone", "qual eval").`));
      active = rows.findIndex(t => t.code === state.goalCode);
    } else {
      const hits = targets.search(catalog, query);
      const shown = hits.slice(0, MAX_SHOWN);
      section(`${hits.length} match${hits.length === 1 ? '' : 'es'}` +
        (hits.length > shown.length ? ` — showing the first ${shown.length}, keep typing to narrow` : ''), shown);
      if (!hits.length) {
        list.appendChild(el('div', { class: 'target-empty' },
          `No event matches "${query}". Try fewer letters, or just the digits of the code.`));
      }
      active = hits.length ? 0 : -1;
    }
    paintActive(true);
  }

  function paintActive(scroll) {
    const els = $('#target-list').querySelectorAll('.target-row');
    els.forEach((r, i) => r.classList.toggle('active', i === active));
    if (scroll && els[active]) els[active].scrollIntoView({ block: 'nearest' });
  }

  function onSearchKey(e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!rows.length) return;
      const step = e.key === 'ArrowDown' ? 1 : -1;
      active = active < 0 ? (step > 0 ? 0 : rows.length - 1) : (active + step + rows.length) % rows.length;
      paintActive(true);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (rows[active]) select(rows[active].code);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      close();
      $('#target-btn').focus();
    }
  }

  function init() {
    $('#target-btn').addEventListener('click', () => { if (isOpen()) close(); else open(); });
    $('#target-search').addEventListener('input', (e) => renderList(e.target.value));
    $('#target-search').addEventListener('keydown', onSearchKey);
    // click anywhere else closes the list
    document.addEventListener('mousedown', (e) => {
      if (isOpen() && !$('#target-picker').contains(e.target)) close();
    });
    // "/" opens the search from anywhere outside a text field
    document.addEventListener('keydown', (e) => {
      if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      e.preventDefault();
      open();
    });
    // an edited / pasted #target= link switches the view
    window.addEventListener('hashchange', () => {
      const code = hashTarget();
      if (code && byCode[code] && code !== state.goalCode) select(code);
    });
  }

  return { init, refresh };
})();

// Populate #student-picker with the roster.
function repopulateStudentPicker() {
  const picker = $('#student-picker');
  picker.innerHTML = '';
  if (!state.payload) {
    picker.appendChild(el('option', { value: '' }, '— no board loaded —'));
    picker.disabled = true;
    return;
  }
  picker.appendChild(el('option', { value: '' }, '— pick a student —'));
  // Sort by type then name for scannability
  const sorted = state.payload.students.slice().sort((a, b) => {
    if (a.type !== b.type) return a.type.localeCompare(b.type);
    return a.name.localeCompare(b.name);
  });
  for (const s of sorted) {
    picker.appendChild(el('option', { value: s.col }, `${s.name} · ${s.type} · ${s.dataGroup}`));
  }
  picker.disabled = (state.mode !== 'student');
  if (state.studentCol) picker.value = String(state.studentCol);
}

/* --------------------------------------------------------
 * boot — wire up header controls + initial load
 * -------------------------------------------------------- */
async function boot() {
  $('#app-version').textContent = `v${APP_VERSION} · MCG ${MCG_VERSION}`;
  $('#foot-version').textContent = APP_VERSION;
  $('#foot-mcg').textContent = MCG_VERSION;
  $('#foot-endpoint').textContent = CONFIG.GAS_ENDPOINT ? '◉ endpoint set' : '⚠ CONFIG.GAS_ENDPOINT not set';

  // v0.5: fetch MCG before anything else. No cached sheet can be rendered
  // without the graph, so this is a blocking step. Failure => banner already
  // shown by loadMcgGraph; let the user retry after fixing hosting.
  try {
    await loadMcgGraph();
    if (MCG_GRAPH.generatedDate) {
      $('#foot-mcg').textContent = MCG_VERSION + ' · ' + MCG_GRAPH.generatedDate;
      $('#foot-mcg').title = Object.keys(MCG_GRAPH.events).length + ' events · ' + (MCG_GRAPH.goalEvents || []).length + ' goals';
    }
  } catch (_) {
    // Fatal for rendering; leave UI in a minimal state.
    return;
  }

  // Cache canary (v0.3.3): write a timestamp on boot, read back the
  // previous one. If the previous canary survived across reloads,
  // localStorage persists for this origin. If it doesn't, the user is
  // probably on a browser or mode that wipes storage (incognito, "clear
  // on exit", file:// with strict settings) and the sheet cache won't
  // persist either — call that out up front.
  try {
    const prev = localStorage.getItem('bbcs::canary');
    const now = Date.now();
    localStorage.setItem('bbcs::canary', String(now));
    const readback = localStorage.getItem('bbcs::canary');
    if (readback !== String(now)) {
      console.error('[bbcs] localStorage write/read mismatch — cache will NOT work');
      banner('localStorage is not persisting — sheet cache will not survive reloads. Check browser privacy settings or try serving via http://localhost.', true);
    } else if (!prev) {
      console.log('[bbcs] cache canary: first boot (or cache was cleared). Future reloads should hit cache.');
    } else {
      const ageMin = Math.round((now - parseInt(prev, 10)) / 60000);
      console.log(`[bbcs] cache canary: previous boot was ${ageMin} min ago — localStorage persists ✓`);
    }
  } catch (e) {
    console.error('[bbcs] localStorage unavailable:', e);
    banner('localStorage not available — sheet data will re-fetch every time. ' + (e.message || e), true);
  }

  updateCacheFooter();

  $('#btn-knobs').addEventListener('click', layoutPanel);
  $('#btn-settings').addEventListener('click', settingsPanel);
  $('#btn-legend').addEventListener('click', legendPanel);
  $('#btn-issues').addEventListener('click', () => issues.showPanel());
  $('#btn-debug-students').addEventListener('click', renderDebugStudents);
  $('#btn-debug-events').addEventListener('click', renderDebugEvents);
  $('#panel-close').addEventListener('click', closePanel);
  $('#panel-backdrop').addEventListener('click', closePanel);

  $('#btn-load').addEventListener('click', () => loadCurrentSheet({ force: false }));
  $('#btn-refresh').addEventListener('click', () => loadCurrentSheet({ force: true }));
  $('#btn-refresh-list').addEventListener('click', async () => {
    // Manual GAS hit to pull fresh sheet-list. Updates the picker but doesn't load a sheet.
    const btn = $('#btn-refresh-list');
    btn.disabled = true; btn.textContent = '⟳ …';
    try {
      const list = await api.sheetsAvail();
      fillSheetPicker(list.sheets);
      banner(`Tab list refreshed — ${list.sheets.length} tabs.`);
    } catch (e) {
      banner('Could not list sheets: ' + e.message, true);
    } finally {
      btn.disabled = false; btn.textContent = '⟳ Tabs';
    }
  });

  $('#btn-clear-cache').addEventListener('click', () => {
    const info = api.cacheInfo();
    if (!info.length) { banner('Cache is already empty.'); return; }
    const totalKB = info.reduce((s, i) => s + i.sizeKB, 0);
    if (!confirm(`Clear cached data for ${info.length} sheet${info.length > 1 ? 's' : ''} (${totalKB} KB)?\n\nNext load will re-fetch from Google Sheets.`)) return;
    const n = api.clearAll();
    updateCacheFooter();
    banner(`Cleared cache (${n} sheet${n !== 1 ? 's' : ''}). Next Load will hit the sheet fresh.`);
  });

  // View toggle
  $$('#view-toggle .view-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.mode;
      if (mode === state.mode) return;
      state.mode = mode;
      $$('#view-toggle .view-opt').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
      $('#student-picker').disabled = (mode !== 'student');
      // Expand-all / Collapse-all are only meaningful in class view
      $('#expand-group').style.display = (mode === 'class') ? 'flex' : 'none';
      renderCurrent();
    });
  });

  // Expand / Collapse all (class-view only)
  $('#btn-expand-all').addEventListener('click', () => render.setAllExpanded(true));
  $('#btn-collapse-all').addEventListener('click', () => render.setAllExpanded(false));

  // Line style selector — polyline / smooth / straight.
  // Persisted across reloads in localStorage.
  const savedStyle = (() => { try { return localStorage.getItem('bbcs::lineStyle'); } catch (_) { return null; } })();
  if (savedStyle) {
    window.bbcsLineStyle = savedStyle;
    $('#line-style').value = savedStyle;
  } else {
    // v0.6.0: follow whichever <option> is marked selected. This was a
    // hard-coded 'polyline', so after the dropdown default became
    // Straight the control said one thing and the canvas drew another.
    window.bbcsLineStyle = $('#line-style').value;
  }
  $('#line-style').addEventListener('change', (e) => {
    window.bbcsLineStyle = e.target.value;
    try { localStorage.setItem('bbcs::lineStyle', e.target.value); } catch (_) {}
    renderCurrent();
  });

  // Target + student picker wiring
  targetPicker.init();
  $('#student-picker').addEventListener('change', (e) => {
    const col = parseInt(e.target.value, 10);
    state.studentCol = Number.isFinite(col) ? col : null;
    renderCurrent();
  });

  if (!CONFIG.GAS_ENDPOINT) {
    banner('CONFIG.GAS_ENDPOINT is empty. Edit the <script id="config"> block in index.html and paste your GAS /exec URL.', true);
    return;
  }

  // v0.4: cache-first boot. DO NOT hit sheets_avail on page load — that's
  // a 1-3s GAS round trip the user stares at every time. Instead:
  //   1. If we have cached sheets + a cached sheet-list, use those.
  //   2. If no cached sheet-list but cached payloads exist, build the
  //      picker from cache entries.
  //   3. If nothing is cached (first visit), fetch the tab list and load
  //      the default board — v0.6.0; this used to leave an empty,
  //      disabled picker and a Load button that did nothing.
  // Auto-load the last-used cached sheet on boot so the DAG shows up
  // with zero clicks.
  setInterval(updateDataAge, 60000);
  await bootFromCache();
}

// Fill #sheet-picker from a sheets_avail list: class big boards first,
// newest class on top ("26B FTC…" above "26A FTC…", each ahead of its
// STC / Backup variants); every other tab alphabetical after them.
function fillSheetPicker(sheets) {
  const picker = $('#sheet-picker');
  const current = picker.value;
  picker.innerHTML = '';
  const classOf = n => (n.match(/(\d\d[AB])\s.*Big\s?Board/i) || [])[1] || '';
  const sorted = sheets.slice().sort((a, b) => {
    const ca = classOf(a.name), cb = classOf(b.name);
    if (!!ca !== !!cb) return ca ? -1 : 1;
    if (ca !== cb) return cb.localeCompare(ca);
    const da = /^\d/.test(a.name) ? 0 : 1, db = /^\d/.test(b.name) ? 0 : 1;
    if (da !== db) return da - db;
    return a.name.localeCompare(b.name);
  });
  for (const s of sorted) {
    picker.appendChild(el('option', { value: s.name }, `${s.name}  (${s.rows}r × ${s.cols}c)`));
  }
  picker.disabled = false;
  if (current && sorted.find(s => s.name === current)) picker.value = current;
}

// Which board to open with no instruction from the user: the one they
// had open last, else CONFIG.DEFAULT_SHEET, else `fallback`.
function defaultSheet(names, fallback) {
  let last = null;
  try { last = localStorage.getItem('bbcs::lastSheet'); } catch (_) {}
  return [last, CONFIG.DEFAULT_SHEET].find(n => n && names.indexOf(n) !== -1) || fallback || null;
}

// v0.6.0: the app boots from a saved copy of the board, so say how old
// that copy is and flag it once it's a day old.
function updateDataAge() {
  const chip = $('#data-age');
  const fetchedAt = state.payload && state.payload.fetchedAt;
  if (!fetchedAt) { chip.textContent = ''; chip.className = 'data-age'; return; }
  const t = new Date(fetchedAt);
  const hrs = (Date.now() - t.getTime()) / 3600000;
  const age = hrs < 1 ? `${Math.max(1, Math.round(hrs * 60))} min ago`
    : hrs < 48 ? `${Math.round(hrs)} h ago`
    : `${Math.round(hrs / 24)} days ago`;
  const stale = hrs >= 24;
  chip.textContent = 'Board data: '
    + t.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
    + ` (${age})` + (stale ? ' — press Refresh' : '');
  chip.className = 'data-age' + (stale ? ' stale' : '');
  chip.title = 'When this board was last pulled from the Google Sheet. Load reuses the saved copy; Refresh pulls it again.';
}

async function bootFromCache() {
  const cachedList = api.getSheetList();      // v0.4 local storage of last sheets_avail result
  const cachedSheets = api.cacheInfo();       // per-sheet payload cache

  const picker = $('#sheet-picker');
  picker.innerHTML = '';

  if (cachedList && cachedList.length) {
    // Use cached sheet list for the dropdown
    fillSheetPicker(cachedList);
  } else if (cachedSheets.length) {
    // Fallback: at least list sheets we've cached payloads for
    for (const s of cachedSheets) {
      picker.appendChild(el('option', { value: s.name }, `${s.name}  (cached)`));
    }
    picker.disabled = false;
  } else {
    picker.appendChild(el('option', { value: '' }, '— fetching board list… —'));
    picker.disabled = true;
  }
  $('#btn-load').disabled = false;
  $('#btn-refresh').disabled = false;

  // Auto-load a sensible default sheet if we have any cached payloads.
  if (cachedSheets.length) {
    // Last-used board, else the configured default, else most-recently-cached
    const newest = cachedSheets.slice().sort((a, b) => (b.cachedAt || '').localeCompare(a.cachedAt || ''))[0].name;
    picker.value = defaultSheet(cachedSheets.map(s => s.name), newest);
    await loadCurrentSheet({ force: false, source: 'auto' });
    return;
  }

  // v0.6.0: nothing cached — first visit, or the cache was cleared. Get
  // the tab list and the default board without making the user find
  // "⟳ Tabs" first.
  banner('First visit on this browser — fetching the board list…');
  try {
    const list = await api.sheetsAvail();
    fillSheetPicker(list.sheets);
    const names = list.sheets.map(s => s.name);
    const target = defaultSheet(names, names.find(n => /FTC Big Board/i.test(n)) || names[0]);
    if (target) {
      picker.value = target;
      await loadCurrentSheet({ force: false, source: 'auto' });
    }
  } catch (e) {
    picker.innerHTML = '';
    picker.appendChild(el('option', { value: '' }, '— press ⟳ Tabs —'));
    banner('Could not reach the Big Board backend (' + e.message + '). Press ⟳ Tabs to try again.', true);
  }
}

async function loadCurrentSheet({ force, source }) {
  const name = $('#sheet-picker').value;
  if (!name) return;
  if (source !== 'auto') hideBanner();
  $('#btn-load').disabled = true;
  $('#btn-load').textContent = 'Loading…';
  try {
    const preInfo = api.cacheInfo().find(i => i.name === name);
    const wasCached = !!preInfo && !force;
    const raw = await api.fetchSheet(name, { force });
    const payload = parse.indexPayload(raw);
    state.payload = payload;
    chain.resetCache();
    // v0.5.2f: apply persisted duplicate-resolution settings before first
    // render. Without this, byCode is locked to first-row-wins and any
    // saved 'any'/'one' choices don't take effect until the user opens
    // Settings and toggles something.
    applyDupResolution();
    // Reset student selection if roster changed
    if (state.studentCol && !payload.students.find(s => s.col === state.studentCol)) {
      state.studentCol = null;
    }
    $('#view-bar').style.display = 'flex';
    $('#expand-group').style.display = (state.mode === 'class') ? 'flex' : 'none';
    try { localStorage.setItem('bbcs::lastSheet', name); } catch (_) {}
    targetPicker.refresh();
    repopulateStudentPicker();
    renderCurrent();
    updateDataAge();
    const src = wasCached ? `cache (${new Date(preInfo.cachedAt).toLocaleTimeString()})` : 'live fetch';
    const msg = `Loaded "${name}" from ${src} — ${payload.students.length} students, ${payload.events.length} events`;
    const warns = [];
    if (payload.duplicates && payload.duplicates.length) {
      warns.push(`${payload.duplicates.length} duplicate code${payload.duplicates.length>1?'s':''} on this board.`);
    }
    if (payload.layoutNote) warns.push(payload.layoutNote);
    if (warns.length) {
      bannerWithAction(`${msg}. ⚠ ${warns.join(' ⚠ ')}`, 'Open Settings', settingsPanel, true);
    } else {
      banner(msg);
    }
    updateCacheFooter();
  } catch (e) {
    banner('Fetch failed: ' + e.message, true);
  } finally {
    $('#btn-load').disabled = false;
    $('#btn-load').textContent = 'Load';
  }
}

window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
